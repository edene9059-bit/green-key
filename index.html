<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Key Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(135deg, #0b130e 0%, #112217 100%); 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        /* Balance Header Header with Glow */
        .balance-container { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            width: 100%; 
            max-width: 400px; 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(0, 255, 136, 0.2); 
            box-shadow: 0 8px 32px 0 rgba(0, 255, 136, 0.1);
        }
        .balance-title { font-size: 14px; color: #a0aec0; letter-spacing: 1px; text-transform: uppercase; }
        .balance-amount { 
            font-size: 36px; 
            font-weight: 800; 
            color: #00ff88; 
            margin-top: 5px; 
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        /* Navigation Tabs */
        .nav-tabs { 
            display: flex; 
            width: 100%; 
            max-width: 400px; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 14px; 
            padding: 6px; 
            border: 1px solid #1e3a29;
        }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            background: transparent; 
            color: #8f9b93; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        .tab-btn.active { 
            background: linear-gradient(135deg, #00ff88 0%, #00b862 100%); 
            color: #0b130e; 
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        /* Content Sections */
        .section { display: none; width: 100%; max-width: 400px; }
        .section.active { display: block; }

        /* Wheel / Spin Section */
        .wheel-container { position: relative; margin: 25px auto; width: 220px; height: 220px; }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ffd700;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .wheel { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 6px solid #ffd700; 
            background: conic-gradient(
                #00ff88 0deg 90deg, 
                #ff0055 90deg 180deg, 
                #ffd700 180deg 270deg, 
                #00d2ff 270deg 360deg
            ); 
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); 
        }
        .action-btn { 
            background: linear-gradient(135deg, #00ff88 0%, #00b862 100%); 
            color: #0b130e; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: 800; 
            border-radius: 30px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.98); }

        /* Cards Style */
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 16px; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(0, 255, 136, 0.15); 
            backdrop-filter: blur(5px);
        }
        .card-info { text-align: left; }
        .card-title { font-size: 15px; font-weight: 600; color: #ffffff; }
        .card-reward { font-size: 13px; color: #00ff88; font-weight: bold; margin-top: 3px; }
        .small-btn { 
            background: #112217; 
            color: #00ff88; 
            border: 1px solid #00ff88; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s;
        }
        .small-btn:hover { background: #00ff88; color: #0b130e; }
    </style>
</head>
<body>

    <!-- Balance Header -->
    <div class="balance-container">
        <div class="balance-title">የእርስዎ ነጥብ (Balance)</div>
        <div class="balance-amount"><span id="coins">0</span> 🪙</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('spin')">Spin</button>
        <button class="tab-btn" onclick="switchTab('tasks')">Tasks</button>
        <button class="tab-btn" onclick="switchTab('ref')">Friends</button>
    </div>

    <!-- 1. Spin Section -->
    <div id="spin" class="section active">
        <h2 style="color: #e2e8f0; font-size: 20px;">ዕድልዎን ይሞክሩ!</h2>
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="action-btn" onclick="spinWheel()">SPIN NOW!</button>
    </div>

    <!-- 2. Tasks Section -->
    <div id="tasks" class="section">
        <h2 style="color: #e2e8f0; font-size: 20px;">ተግባራት (Tasks)</h2>
        <p style="color: #a0aec0; margin-bottom: 15px; font-size: 13px;">ተግባራቱን በመጨረስ ተጨማሪ ነጥብ ይሰብስቡ</p>
        
        <div class="card">
            <div class="card-info">
                <div class="card-title">Join Telegram Channel</div>
                <div class="card-reward">+500 Coins</div>
            </div>
            <button class="small-btn" onclick="completeTask(this, 500)">Claim</button>
        </div>
        <div class="card">
            <div class="card-info">
                <div class="card-title">Join Telegram Group</div>
                <div class="card-reward">+300 Coins</div>
            </div>
            <button class="small-btn" onclick="completeTask(this, 300)">Claim</button>
        </div>
    </div>

    <!-- 3. Referral Section -->
    <div id="ref" class="section">
        <h2 style="color: #e2e8f0; font-size: 20px;">ጓደኞችዎን ይጋብዙ</h2>
        <p style="color: #a0aec0; margin-bottom: 15px; font-size: 13px;">ለእያንዳንዱ ሰው 200 ነጥብ ያግኙ</p>
        
        <div class="card">
            <div class="card-info">
                <div class="card-title">የመጋበዣ ሊንክዎ</div>
                <div class="card-reward" id="ref-link">https://t.me/greenkeybot?start=ref</div>
            </div>
            <button class="small-btn" onclick="copyRef()">Copy</button>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('user_coins')) || 0;
        document.getElementById('coins').innerText = balance;
        let isSpinning = false;

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('coins').innerText = balance;
            localStorage.setItem('user_coins', balance);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            let randomRot = Math.floor(Math.random() * 360) + 1440;
            let wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${randomRot}deg)`;

            setTimeout(() => {
                let wonCoins = Math.floor(Math.random() * 100) + 50;
                updateBalance(wonCoins);
                alert(`እንኳን ደስ አለዎት! ${wonCoins} ነጥብ አግኝተዋል!`);
                isSpinning = false;
            }, 3000);
        }

        function completeTask(btn, reward) {
            updateBalance(reward);
            btn.innerText = "Done ✓";
            btn.style.background = "#00ff88";
            btn.style.color = "#0b130e";
            btn.disabled = true;
        }

        function copyRef() {
            navigator.clipboard.writeText("https://t.me/greenkeybot?start=ref");
            alert("የመጋበዣ ሊንኩ Copy ሆኗል!");
        }
    </script>
</body>
</html>
